<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noticias & Guiones</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div><h1>Noticias & Guiones</h1><p>Base de datos de contenido</p></div><div class="stats"><span id="newsCount">0 noticias</span><span id="scriptCount">0 guiones</span></div></header>
<nav><button class="tab active" data-tab="noticias">📰 Noticias</button><button class="tab" data-tab="guiones">📝 Guiones</button></nav>
<main>
<section id="noticias" class="panel active">
<div class="section-head"><div><h2>Noticias</h2><p>Cargá primero la fuente que después utilizarás para crear un guion.</p></div><button id="newNews" class="primary">+ Nueva noticia</button></div>
<div id="newsForm" class="form-card hidden"><h3 id="newsFormTitle">Nueva noticia</h3><form><input type="hidden" id="newsId"><label>Título<input id="newsTitle" required placeholder="Ej.: Nuevas medidas económicas"></label><label>Link<input id="newsLink" type="url" required placeholder="https://..."></label><label>Descripción<textarea id="newsDesc" rows="5" placeholder="Resumen o información relevante..."></textarea></label><div class="actions"><button type="button" class="secondary" id="cancelNews">Cancelar</button><button class="primary">Guardar noticia</button></div></form></div>
<div id="newsList" class="grid"></div>
</section>
<section id="guiones" class="panel">
<div class="section-head"><div><h2>Guiones</h2><p>Solo podés crear un guion a partir de una noticia existente.</p></div><button id="newScript" class="primary">+ Nuevo guion</button></div>
<div id="scriptForm" class="form-card hidden"><h3 id="scriptFormTitle">Nuevo guion</h3><form><input type="hidden" id="scriptId"><label>Noticia de origen<select id="scriptNews" required></select></label><label>Título del guion<input id="scriptTitle" required placeholder="Ej.: Guion para video de 60 segundos"></label><label>Texto del guion<textarea id="scriptContent" class="big" required placeholder="Escribí el guion completo acá. No hay límite práctico impuesto por la aplicación..."></textarea></label><div class="actions"><button type="button" class="secondary" id="cancelScript">Cancelar</button><button class="primary">Guardar guion</button></div></form></div>
<div id="scriptList" class="list"></div>
</section>
</main><div id="toast"></div><script src="app.js"></script></body></html>
